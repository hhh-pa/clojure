name: rust

on:
  # Daily master build (default branch only, full job matrix, no path
  # filter): catches toolchain drift and flaky gates even on quiet
  # days. Off-peak minute to dodge the top-of-hour queue.
  schedule:
    - cron: "30 5 * * *"
  # Manual full runs (same unfiltered matrix as the schedule).
  workflow_dispatch:
  # PR branches run via pull_request only: an unfiltered push trigger
  # fires a twin run on every PR push, and the concurrency group then
  # murders one twin — doubling queue pressure and leaving
  # cancelled-duplicate (corpse) check rows beside every green row.
  # Branches without a PR get no runs until one opens (dispatch
  # covers branch-only validation); tags never trigger here
  # (rust-release.yml owns v*).
  push:
    branches: [master]
    paths:
      - "rust/**"
      - "scripts/ci/**"
      - ".dockerignore"
      - ".github/workflows/rust.yml"
      # Local composite actions (profile-runner, setup-llvm) run in
      # every job; without this, edits to them never trigger CI.
      - ".github/actions/**"
      # The tla job checks the specs; spec-only edits must trigger.
      - "docs/t1174/models/**"
  pull_request:
    paths:
      - "rust/**"
      - "scripts/ci/**"
      - ".dockerignore"
      - ".github/workflows/rust.yml"
      - ".github/actions/**"
      - "docs/t1174/models/**"

# One run per branch at a time: a new push supersedes in-flight runs
# (rapid rounds would otherwise pile up behind slow platform
# runners). PR and push events share the group via
# head_ref/ref_name; master serializes. (Push is master-only since
# the trigger dedupe, so twin runs can no longer occur.)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least privilege: jobs inherit read-only; artifact upload, the GHA
# cache, and PR comments widen their own job below.
permissions:
  contents: read

jobs:
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      actions: write # cargo cache
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      - uses: ./.github/actions/setup-llvm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Cargo registry + target/ cache: warm runs skip crate downloads
      # and reuse prior compilation. `save-if` forces a save on branch
      # runs too, so the second push already hits.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: 'true'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # checkout
      actions: write # cargo cache
    # No macOS leg: ordinary runs skip it (host capacity starves
    # macos-latest for hours); macOS tests run on v* tags via
    # rust-release.yml instead.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      - uses: ./.github/actions/setup-llvm
      - uses: dtolnay/rust-toolchain@stable
      # S8 link tests shell to `link` on Windows: put the MSVC
      # toolchain (link.exe + INCLUDE/LIB) on PATH first.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # Cargo registry + target/ cache: warm runs skip crate downloads
      # and reuse prior compilation. `save-if` forces a save on branch
      # runs too, so the second push already hits.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: 'true'
      - run: cargo test --workspace --locked

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      actions: write # cargo cache
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: 'true'
      # S9A D2: LLVM-dependent compilation excluded (inkwell 0.10.0
      # declares no MSRV); the binary builds --no-default-features
      # so clj-aot never enters the unit graph.
      - run: cargo test --locked -p clj-core -p clj-eval -p clj-reader -p clj-repl -p clj-rt -p clj-value
      - run: cargo test --locked -p clojure-rs --no-default-features

  test-no-default:
    name: test unlinked (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # checkout
      actions: write # cargo cache
    # No macOS leg (see test above); the unlinked suite also runs
    # on macOS on v* tags via rust-release.yml.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Linker only (no setup-llvm): this leg proves the LLVM-free
      # path, including the unlinked-backend report (R1 residual).
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: 'true'
      - run: cargo test --locked --no-default-features -p clojure-rs

  loom-models:
    name: loom models
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      actions: write # cargo cache
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # No setup-llvm: clj-value is pure Rust, so the models run
      # without the LLVM toolchain.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: 'true'
      # S9D: the loom mirrors explore every schedule in-process
      # (loom types are used directly, so no cfg gate is needed) —
      # this step is the explicit CI evidence, alongside the
      # workspace suite above which runs the same targets.
      - run: cargo test --locked -p clj-value --test loom_agent --test loom_delay --test loom_future

  tla:
    name: tla model check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      actions: write # tla2tools cache
    defaults:
      run:
        working-directory: docs/t1174/models
    steps:
      - uses: actions/checkout@v5
      - name: set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: restore tla2tools
        id: tla-cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/tla-tools/tla2tools.jar
          key: tla2tools-v1.7.4-936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
      - name: download tla2tools
        if: steps.tla-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/tla-tools
          curl -fsSL -o /tmp/tla-tools/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla-tools/tla2tools.jar' | sha256sum --check -
      - name: save tla2tools
        if: steps.tla-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /tmp/tla-tools/tla2tools.jar
          key: tla2tools-v1.7.4-936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
      # S9D: model-check the agent-queue spec (7.1M distinct states at
      # the pinned bounds; ~2-10 min depending on runners). TLC exits
      # non-zero on any invariant/property/deadlock violation; on
      # failure stdout carries the error trace.
      - name: run TLC (agent queue)
        run: |
          java -Xmx2g -XX:+UseParallelGC -cp /tmp/tla-tools/tla2tools.jar tlc2.TLC \
            -workers auto -cleanup -config agent_queue.cfg agent_queue.tla

  quality-gates:
    name: quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read # checkout
      actions: write # coverage artifact + GHA image cache
      pull-requests: write # sticky coverage comment
      id-token: write # codecov OIDC upload auth (no stored token)
    env:
      # Image repo for the cached gate image (public, so pulls stay
      # anonymous). Override with the GATE_IMAGE repo variable; pushes need
      # the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets (a PAT with
      # read+write on the namespace). Without the token the image builds
      # local-only and the gates still run (fork PRs stay green, slower).
      GATE_IMAGE: ${{ vars.GATE_IMAGE || 'hhhpa/clojure' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      # Cache key: every input the image depends on. A hit pulls the image
      # and runs the gates in it; a miss rebuilds, pushes, then runs.
      - name: compute image key
        run: |
          key="${{ hashFiles('rust/Cargo.lock', 'scripts/ci/quality-gates.Dockerfile', 'scripts/ci/go/**') }}"
          echo "GATE_KEY=$key" >> "$GITHUB_ENV"
          echo "Gate image: $GATE_IMAGE:$key"
      - name: pull gate image
        id: pull
        continue-on-error: true
        run: docker pull "$GATE_IMAGE:$GATE_KEY"
      - name: set up buildx
        if: steps.pull.outcome == 'failure'
        uses: docker/setup-buildx-action@v4
      # `secrets` is unusable in `if:`, so probe it in `run:` and gate on
      # the output instead.
      - name: check docker hub credentials
        id: creds
        if: steps.pull.outcome == 'failure'
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: docker hub login
        if: steps.pull.outcome == 'failure' && steps.creds.outputs.available == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build gate image
        if: steps.pull.outcome == 'failure'
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            docker buildx build --push --cache-from type=gha --cache-to type=gha,mode=max \
              -t "$GATE_IMAGE:$GATE_KEY" -f scripts/ci/quality-gates.Dockerfile .
          else
            echo '::warning::DOCKERHUB_TOKEN not set; gate image stays local.'
            docker buildx build --load --cache-from type=gha --cache-to type=gha,mode=max \
              -t "$GATE_IMAGE:$GATE_KEY" -f scripts/ci/quality-gates.Dockerfile .
          fi
      # Go CI-tools: the built binaries are cached by exact source hash,
      # so runs without Go changes skip setup-go, test, and build
      # entirely; a miss rebuilds (with the Go build cache warm) and
      # re-saves only after a successful build. The live invocations
      # below run ./ci-tools-bin (bind-mounted into the gate container
      # where the gates need the provisioned image).
      - name: restore ci-tools binaries
        id: tools-bin-cache
        uses: actions/cache/restore@v5
        with:
          path: ci-tools-bin
          key: ci-tools-${{ runner.os }}-${{ hashFiles('scripts/ci/go/**') }}
      - name: set up Go
        if: steps.tools-bin-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: scripts/ci/go/go.mod
          cache: false # stdlib-only module: nothing to cache but the build below
      - name: cache Go build
        if: steps.tools-bin-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('scripts/ci/go/**') }}
          restore-keys: |
            go-build-${{ runner.os }}-
      - name: test Go CI-tools
        if: steps.tools-bin-cache.outputs.cache-hit != 'true'
        working-directory: scripts/ci/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          # Platform-tagged files never compile on Linux CI otherwise;
          # build every CI OS.
          GOOS=windows go build ./...
          GOOS=darwin go build ./...
      - name: build ci-tools binaries
        id: build-tools
        if: steps.tools-bin-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ci-tools-bin && mkdir -p ci-tools-bin
          cd scripts/ci/go
          for tool in coverage-floor coverage-patch coverage-summary geiger complexity rust-quality-gates; do
            CGO_ENABLED=0 go build -o "$GITHUB_WORKSPACE/ci-tools-bin/$tool" ./cmd/$tool
          done
          ls "$GITHUB_WORKSPACE/ci-tools-bin"
      - name: save ci-tools binaries
        if: steps.tools-bin-cache.outputs.cache-hit != 'true' && steps.build-tools.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ci-tools-bin
          key: ci-tools-${{ runner.os }}-${{ hashFiles('scripts/ci/go/**') }}
      # Patch-coverage input for the S9A gate: a two-dot diff against
      # the base tip needs no merge-base, so a depth-1 base fetch
      # suffices (cheap, no history). `git diff` exits 1 when
      # differences exist — only >1 is a failure. On master the diff
      # is empty and the patch gate passes vacuously.
      # Keep the `git diff --unified=0` format: coverage-patch fails
      # closed on a non-empty diff without `diff --git` headers
      # (refusing a vacuous pass), so piping this through a filter
      # that strips headers or switching to plain `diff -u` would
      # red the gate rather than silently disable it.
      - name: compute patch diff
        run: |
          git fetch origin "${{ github.base_ref || 'master' }}" --depth=1 --quiet
          git diff --unified=0 FETCH_HEAD HEAD -- rust/ > patch.diff; code=$?
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          wc -l patch.diff
      - name: run quality gates
        run: docker run --rm -e PATCH_DIFF=/work/patch.diff -v "${{ github.workspace }}:/work" -v "${{ github.workspace }}/ci-tools-bin:/tools" -w /work "$GATE_IMAGE:$GATE_KEY" /tools/rust-quality-gates rust rust/target/llvm-cov nextest --run-ignored all --no-fail-fast
      # The container runs as root; hand the report back so later steps can
      # read it.
      - name: take ownership of coverage report
        if: always()
        run: |
          if [ -d rust/target/llvm-cov ]; then
            sudo chown -R "$(id -u):$(id -g)" rust/target/llvm-cov
          fi
      - name: publish coverage summary
        if: always()
        run: ./ci-tools-bin/coverage-summary --out rust/target/llvm-cov/coverage-comment.md rust/target/llvm-cov/lcov.info >> "$GITHUB_STEP_SUMMARY"
      - name: upload coverage report
        if: always() && hashFiles('rust/target/llvm-cov/lcov.info') != ''
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: rust/target/llvm-cov/
          retention-days: 30
      - name: coverage PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('rust/target/llvm-cov/coverage-comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: coverage
          path: rust/target/llvm-cov/coverage-comment.md
          skip_unchanged: true
      - name: upload coverage to codecov
        if: always() && hashFiles('rust/target/llvm-cov/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          # OIDC, not a stored token: the only available token was a
          # personal-account one that Codecov cannot map to this repo
          # ("Repository not found"). Needs id-token: write above.
          use_oidc: true
          files: rust/target/llvm-cov/lcov.info
          # Else the action also sweeps up go testdata fixtures and
          # stray files (it found 10); only the explicit file counts.
          disable_search: true
          fail_ci_if_error: false
      - name: upload test results to codecov
        if: ${{ !cancelled() && hashFiles('rust/target/nextest/default/junit.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: rust/target/nextest/default/junit.xml
          report_type: test_results
          disable_search: true
          fail_ci_if_error: false

  go-tools-test:
    name: go ci-tools tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      actions: write # profiler cache save; ci-tools restore only (gates owns that save)
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      # Same binary cache as the gates preamble: a hit means this
      # exact source hash already passed, so setup and tests skip.
      # Restore-only here; the gates job owns the save.
      - name: restore ci-tools binaries
        id: tools-bin-cache
        uses: actions/cache/restore@v5
        with:
          path: ci-tools-bin
          key: ci-tools-${{ runner.os }}-${{ hashFiles('scripts/ci/go/**') }}
      - uses: actions/setup-go@v6
        if: steps.tools-bin-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: scripts/ci/go/go.mod
          cache: false # stdlib-only module: no go.sum to cache against
      - run: go test ./...
        if: steps.tools-bin-cache.outputs.cache-hit != 'true'
        working-directory: scripts/ci/go

  # Every run keeps its Linux/Windows release binaries as downloadable
  # Actions artifacts (`clojure-rs-<target>.tar.gz` per OS, 14-day
  # retention), so any commit's build can be fetched without cutting a
  # tag release; macOS binaries ship on v* tags via rust-release.yml.
  build-release:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # checkout
      actions: write # artifact upload
    # No macOS leg (see test above); macOS release binaries build
    # on v* tags via rust-release.yml.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      - uses: ./.github/actions/setup-llvm
      - uses: dtolnay/rust-toolchain@stable
      # The AOT smoke shells to `link` on Windows: put the MSVC
      # toolchain (link.exe + INCLUDE/LIB) on PATH first.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # Cargo registry + target/ cache: warm runs skip crate downloads
      # and reuse prior compilation. `save-if` forces a save on branch
      # runs too, so the second push already hits.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: 'true'
      - run: cargo build --release --locked
      # Materialize the S8 runtime archive (dependency builds only
      # emit the rlib; the staticlib ships next to the binary).
      - run: cargo build --release --locked -p clj-rt
      # Same package steps as rust-release.yml: smoke-test the binary,
      # then tar it as dist/clojure-rs-<target>.tar.gz.
      - name: package binary
        id: package
        shell: bash
        run: |
          set -euo pipefail
          # Git bash prepends its own dirs (coreutils `link`) ahead of
          # the MSVC toolchain msvc-dev-cmd put first: re-pin MSVC bin
          # first so the AOT smoke's `link` is link.exe (else coreutils
          # link fails with "extra operand").
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$(cygpath -u "$VCToolsInstallDir")bin/Hostx64/x64:$PATH"
            case "$(command -v link)" in *usr/bin/*) echo "MSVC link shadowed by coreutils" >&2; exit 1;; esac
          fi
          target=$(rustc -vV | sed -n 's/^host: //p')
          bin=target/release/clojure-rs
          archive=target/release/libcljrt.a
          exesfx=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="$bin.exe"
            archive=target/release/cljrt.lib
            exesfx=".exe"
          fi
          test -x "$bin"
          test -f "$archive"
          "$bin" --version | grep -q '^clojure-rs '
          "$bin" --help | grep -q 'Usage:'
          mkdir -p dist
          asset="dist/clojure-rs-$target.tar.gz"
          tar -czf "$asset" -C target/release "$(basename "$bin")" "$(basename "$archive")"
          # Packaging smoke (S7D): the shipped artifact itself must
          # evaluate — extract to a scratch dir and run eval there.
          smoke=$(mktemp -d)
          tar -xzf "$asset" -C "$smoke"
          test "$("$smoke/$(basename "$bin")" eval '(+ 1 2)')" = "3"
          # AOT smoke (S8D): the shipped binary must compile AND run a
          # hello program against the shipped archive next door (no
          # flags — this exercises exe-dir autodiscovery end to end).
          echo '(print (+ 40 2))' > "$smoke/hello.clj"
          (cd "$smoke" && "./$(basename "$bin")" build hello.clj -o "hello$exesfx")
          test "$("$smoke/hello$exesfx")" = "42"
          rm -rf "$smoke"
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: clojure-rs-${{ steps.package.outputs.target }}
          path: rust/dist/clojure-rs-*.tar.gz
          if-no-files-found: error
          retention-days: 14
