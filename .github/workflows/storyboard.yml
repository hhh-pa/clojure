# Storyboard sync: keeps ProjectV2 #2 (the zero-divergence
# storyboard) in step with issues/PRs, so nobody hand-edits the
# board for mechanical moves.
#
# Design (schedule reconciliation, not events): the original
# event-driven shape (issues/pull_request_target labeled/closed,
# #139) never fired — zero runs from any declared trigger across
# label probes, issue closes, and PR merges, while every push
# repo-wide produced a zero-job failed run for the file. Two
# stacked causes, both fixed here: (1) the `secrets` context in
# job-level `if:` invalidates the whole file (GitHub:
# "Unrecognized named-value"), so the secret gates inside the
# script (#144); (2) `gh api -f` variables fail to bind
# `singleSelectOptionId` ("Type mismatch ... (ID! / String)"),
# so every GraphQL value interpolates inline instead (hand-proven
# before automating; simulation also scoped ADD to open-only).
#
# Each pass does two things. ADD: OPEN issues missing from the
# board get items (open-only: no closed-history backfill).
# RECONCILE: every content item converges to its desired state:
#   closed (incl. merged)           -> Status=Done (Session kept)
#   open + session:<id> label        -> Status=In Progress, Session=<id>
#   open + no session:* label        -> Status=Todo, Session cleared
# Draft cards, assignees, Labels rollup, and Slice-status are
# untouched. Only drifts are written.
#
# Board shape (owner-directed): stories (issues) are rows; PRs live
# in the Linked-pull-requests column via closing keywords (`Fixes
# #N` in the PR body links even retroactively on merged PRs, with
# no state change). The ADD pass is issues-only on purpose: PR
# rows are never created (any stragglers get no special handling;
# delete them by hand).
#
# Claim protocol compatibility: sessions label their STORY issue
# `session:<id>` and post CLAIM on #88; the board follows within
# 15 minutes (or run the workflow by hand). YIELD = remove your
# label (board drops to Todo at the next pass). PR labels are
# ignored (PRs are not rows).
#
# Auth: GITHUB_TOKEN cannot write org ProjectsV2, so this needs a
# repo Actions secret PROJECT_TOKEN (classic PAT, `project` scope
# only, 90-day expiry): repo Settings -> Secrets and variables ->
# Actions -> New repository secret. Without it the job skips with
# a warning and nothing reds.
#
# IDs below are storyboard-specific (project PVT_kwDOEkzkc84Bo8xa):
# Status field PVTSSF_lADOEkzkc84Bo8xazhnahX8 (Todo f75ad846,
# In Progress 47fc9ee4, Done 98236657), Session text field
# PVTF_lADOEkzkc84Bo8xazhnjDYQ. If the board is ever rebuilt,
# re-read them via the projectV2 GraphQL fields query.

name: storyboard

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Read-only except the PAT-authed project writes below.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile board items
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          # No job/step `if:` on secrets: GitHub's parser rejects
          # the secrets context there ("Unrecognized named-value"),
          # which invalidates the whole file (dead triggers +
          # zero-job push failures) — so gate inside the script.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo '::warning::PROJECT_TOKEN secret not set; storyboard sync skipped (see storyboard.yml header).'
            exit 0
          fi
          proj=PVT_kwDOEkzkc84Bo8xa
          status_field=PVTSSF_lADOEkzkc84Bo8xazhnahX8
          session_field=PVTF_lADOEkzkc84Bo8xazhnjDYQ
          opt_todo=f75ad846
          opt_prog=47fc9ee4
          opt_done=98236657
          repo=hhh-pa/clojure

          # All GraphQL values interpolate inline: `gh api -f`
          # variables fail to bind singleSelectOptionId.
          gql_items() {
            gh api graphql -f query="query{ node(id:\"$proj\"){... on ProjectV2{
              items(first:100){nodes{id
                content{__typename
                  ... on Issue{number closed labels(first:30){nodes{name}}}}
                  ... on PullRequest{number closed labels(first:30){nodes{name}}}}
                fieldValues(first:10){nodes{__typename
                  ... on ProjectV2ItemFieldSingleSelectValue{optionId
                    field{... on ProjectV2SingleSelectField{id}}}
                  ... on ProjectV2ItemFieldTextValue{text
                    field{... on ProjectV2Field{id}}}}}}}}}"
          }
          gql_add() { # $1 = content node id -> item id
            gh api graphql -f query="mutation{ addProjectV2ItemById(
              input:{projectId:\"$proj\",contentId:\"$1\"}){
              item{id}}}" --jq .data.addProjectV2ItemById.item.id
          }
          gql_set_status() { # $1 = item, $2 = option id
            gh api graphql -f query="mutation{ updateProjectV2ItemFieldValue(
              input:{projectId:\"$proj\",itemId:\"$1\",fieldId:\"$status_field\",
              value:{singleSelectOptionId:\"$2\"}}){clientMutationId}}" >/dev/null
          }
          gql_set_session() { # $1 = item, $2 = text
            gh api graphql -f query="mutation{ updateProjectV2ItemFieldValue(
              input:{projectId:\"$proj\",itemId:\"$1\",fieldId:\"$session_field\",
              value:{text:\"$2\"}}){clientMutationId}}" >/dev/null
          }

          # ADD pass: OPEN issues missing from the board get
          # items. Open-only is deliberate: backfilling closed
          # history would 2x the board past first:100 (simulated:
          # 65 stale misses vs 1 live one). Closed items already
          # on the board flip to Done in the reconcile below.
          # (PRs are never rows; see the header.)
          have=$(gql_items | jq -r '[.data.node.items.nodes[]
            | .content.number // empty] | map(tostring) | join(" ")')
          add_missing() { # $1 = kind for log, $2 = REST endpoint
            # (Issues endpoint includes PRs: keep pure issues
            # here; PRs come from the pulls endpoint below.)
            gh api "repos/$repo/$2" --paginate -X GET -f state=open -f per_page=100 \
              --jq '.[] | select(.pull_request == null)
                    | [.number, .state, .node_id,
                       ([.labels[].name] | join(" "))] | @tsv' |
            while IFS=$'\t' read -r num state node labels; do
              case " $have " in *" $num "*) continue;; esac
              item=$(gql_add "$node")
              session=$(printf '%s' "$labels" | tr ' ' '\n' |
                        grep '^session:' | head -1 | cut -d: -f2-)
              if [ "$state" = closed ]; then
                gql_set_status "$item" "$opt_done"
              elif [ -n "$session" ]; then
                gql_set_status "$item" "$opt_prog"
                gql_set_session "$item" "$session"
              else
                gql_set_status "$item" "$opt_todo"
              fi
              echo "added $1 #$num"
            done
          }
          add_missing issue issues
          # No PR pass on purpose (owner-directed board shape):
          # stories are rows, PRs live in Linked-pull-requests via
          # closing keywords. Never re-add a pulls loop here.

          # RECONCILE pass: converge every content item (fresh read,
          # so just-added items join in with correct fields already
          # set — the loop below only fixes drift).
          gql_items |
          jq -r --arg sf "$status_field" --arg yf "$session_field" '
            [.data.node.items.nodes[]
             | select(.content.__typename != "DraftIssue")
             | {item: .id, num: .content.number, closed: .content.closed,
                session: ([.content.labels.nodes[].name
                           | select(startswith("session:")) | .[8:]]
                          | first // ""),
                cur_status: ([.fieldValues.nodes[]
                              | select(.field.id == $sf) | .optionId]
                             | first // ""),
                cur_session: ([.fieldValues.nodes[]
                               | select(.field.id == $yf) | .text]
                              | first // "")}]
             | .[] | @json' |
          while IFS= read -r row; do
            item=$(jq -r .item <<<"$row")
            num=$(jq -r .num <<<"$row")
            closed=$(jq -r .closed <<<"$row")
            session=$(jq -r .session <<<"$row")
            cur_status=$(jq -r .cur_status <<<"$row")
            cur_session=$(jq -r .cur_session <<<"$row")

            if [ "$closed" = true ]; then
              want_status=$opt_done; want_session=$cur_session
            elif [ -n "$session" ]; then
              want_status=$opt_prog
              # Keep an annotated Session that already names this
              # owner ("still-galaxy (uuid)" survives; a changed
              # owner or an empty field takes the label id).
              case "$cur_session" in
                "$session"*) want_session=$cur_session;;
                *) want_session=$session;;
              esac
            else
              want_status=$opt_todo; want_session=""
            fi

            if [ "$want_status" != "$cur_status" ]; then
              gql_set_status "$item" "$want_status"
              echo "#$num status -> $want_status"
            fi
            if [ "$want_session" != "$cur_session" ]; then
              gql_set_session "$item" "$want_session"
              echo "#$num session -> [$want_session]"
            fi
          done
          echo "reconcile done"
