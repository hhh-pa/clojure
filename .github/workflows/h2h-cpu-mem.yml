# Head-to-head CPU/RSS gate: clojure-rs revisions vs JVM Clojure
# and vs each other, across the snippet suite (hhh-pa/clojure-code-snippet)
# and the algorithms suite (hhh-pa/clojure-algorithms). Each suite
# runs a JVM leg plus TWO clojure-rs legs (rs-from, rs-to), sharded
# 8 ways (48 measure jobs); the h2h-compare job unions the shards
# per leg and gates on per-case median cpu_s + maxrss_kb. The gate
# rule: clojure-rs must beat JVM Clojure, AND rs-from must
# win-or-tie vs rs-to on every case — ANY loss fails the PR.
# (Near-tie wobble can in principle red the native leg on a no-op
# change; if the tables show only marginal losses, consider a
# noise margin rather than weakening the rule silently.)
#
# Revision pairs ("PR from head to base" parlance): from is the
# change under test, to is its baseline. On pull_request, from =
# PR head (github.sha, the merge commit CI tests), to = PR base
# SHA — stacked PRs compare against their parent branch
# automatically. On workflow_dispatch, from defaults to the
# dispatched ref and to to master, so dispatching on a branch
# compares <branch> vs <master>; the rs_from/rs_to inputs override
# either side (40-char SHA or any branch/tag, for bisection).
#
# This is a gate, not a tracker: it reports no Bencher history.
# Triage mode: dispatch with report_only=true to get the verdict
# tables green.
#
# Session recipe: the flags below encode the workstation h2h sweep
# (PR225 test plan): --repeat 3 --no-alloc --no-perf --jobs 3, GNU
# time as the cpu/maxrss signal, temurin 21 + Clojure 1.12.0 jars
# for the JVM legs.
#
# Suite revisions pin to master SHAs (env defaults below); dispatch
# inputs override either pin for bisection, mirroring the
# clojure_rs_sha pattern of the snippet repos.
#
# REQUIRED SECRET: RESOURCES_PASSPHRASE (the snippet resource-bundle
# passphrase) at organization level with access to hhh-pa/clojure
# (visibility chosen when the secret was moved). The recipes legs
# fail loud without it. (The algorithms suite carries its
# resources/ in-repo and needs no decrypt.)

name: h2h-cpu-mem

on:
  pull_request:
  workflow_dispatch:
    inputs:
      snippets_sha:
        description: 'Pin clojure-code-snippet to this revision (40-char SHA; empty = pinned default)'
        required: false
        default: ''
      algorithms_sha:
        description: 'Pin clojure-algorithms to this revision (40-char SHA; empty = pinned default)'
        required: false
        default: ''
      rs_from:
        description: 'Native-vs-native head: 40-char SHA or branch/tag (empty = PR head, or dispatched ref)'
        required: false
        default: ''
      rs_to:
        description: 'Native-vs-native base: 40-char SHA or branch/tag (empty = PR base, or master on dispatch)'
        required: false
        default: ''
      report_only:
        description: 'Triage mode: print verdicts but keep the gate green'
        required: false
        default: false
        type: boolean

# One run per branch at a time, like rust.yml: a new push
# supersedes the in-flight sweep instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned suite revisions (master SHAs at authoring time).
  SNIPPETS_SHA_DEFAULT: 5cc7903c827563f914f9a4f23e118bca5ea103dc
  ALGORITHMS_SHA_DEFAULT: ab26ab930f1b35497d2e7cef030023777f436786
  # Pinned (not floating "21"): JDK micro versions move cpu numbers
  # and the sweep must stay comparable run to run. Bump deliberately.
  JAVA_VERSION: '21.0.13'
  JARS_CACHE_KEY: clojure-jars-1.12.0-spec0.5.238-core0.4.74-v1

jobs:
  # Resolve the suite revisions AND the native-vs-native revision
  # pair ONCE per run so all 48 measure legs sweep the same commits.
  # Suite defaults: the pinned SHAs above; a manual dispatch may pin
  # either input instead (bisection). Native pair: PR head/base by
  # default on pull_request (stacked PRs diff against their parent),
  # dispatched-ref/master on workflow_dispatch; rs_from/rs_to take a
  # 40-char SHA or any branch/tag.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      snippets_sha: ${{ steps.resolve.outputs.snippets_sha }}
      algorithms_sha: ${{ steps.resolve.outputs.algorithms_sha }}
      rs_from_sha: ${{ steps.resolve.outputs.rs_from_sha }}
      rs_to_sha: ${{ steps.resolve.outputs.rs_to_sha }}
    steps:
      - id: resolve
        run: |
          snippets="${{ inputs.snippets_sha }}"
          algos="${{ inputs.algorithms_sha }}"
          [ -z "$snippets" ] && snippets="${{ env.SNIPPETS_SHA_DEFAULT }}"
          [ -z "$algos" ] && algos="${{ env.ALGORITHMS_SHA_DEFAULT }}"
          from="${{ inputs.rs_from }}"
          to="${{ inputs.rs_to }}"
          [ -z "$from" ] && from="${{ github.sha }}"
          if [ -z "$to" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              to="${{ github.event.pull_request.base.sha }}"
            else
              to="master"
            fi
          fi
          to_sha() {
            # Print the 40-char SHA for a SHA-or-ref input.
            if printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$'; then
              printf '%s' "$1"
            else
              git ls-remote https://github.com/hhh-pa/clojure "$1" | awk '{print $1}' | head -n 1
            fi
          }
          from_sha="$(to_sha "$from")"
          to_sha="$(to_sha "$to")"
          for sha in "$snippets" "$algos" "$from_sha" "$to_sha"; do
            if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "error: resolved revision is not a 40-char SHA: '$sha'" >&2
              exit 1
            fi
          done
          echo "snippets_sha=$snippets" >> "$GITHUB_OUTPUT"
          echo "algorithms_sha=$algos" >> "$GITHUB_OUTPUT"
          echo "rs_from_sha=$from_sha" >> "$GITHUB_OUTPUT"
          echo "rs_to_sha=$to_sha" >> "$GITHUB_OUTPUT"
          {
            echo "suite revisions:"
            echo "  clojure-code-snippet: \`$snippets\`"
            echo "  clojure-algorithms: \`$algos\`"
            echo "native-vs-native revisions:"
            echo "  from: \`$from_sha\` ($from)"
            echo "  to: \`$to_sha\` ($to)"
          } >> "$GITHUB_STEP_SUMMARY"

  # The two native revisions under test (interpreter-only release:
  # `run` needs no LLVM), each fanned out to its 16 measure legs as
  # an artifact. rs-from is what the JVM gate tests; rs-to is its
  # comparison base (PR base, or master on dispatch).
  build-rs:
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # checkout
      actions: write # cargo cache + binary artifact
    strategy:
      fail-fast: false
      matrix:
        rev: [rs-from, rs-to]
    name: build-rs ${{ matrix.rev }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.rev == 'rs-from' && needs.resolve.outputs.rs_from_sha || needs.resolve.outputs.rs_to_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: 'true'
      - name: Build clojure-rs
        run: |
          cd rust
          cargo build --release --locked --no-default-features
          mkdir -p "$GITHUB_WORKSPACE/cljrs-bin"
          cp target/release/clojure-rs "$GITHUB_WORKSPACE/cljrs-bin/"
          echo "clojure-rs ${{ matrix.rev }}: \`${{ matrix.rev == 'rs-from' && needs.resolve.outputs.rs_from_sha || needs.resolve.outputs.rs_to_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload clojure-rs binary
        uses: actions/upload-artifact@v6
        with:
          name: cljrs-${{ matrix.rev }}
          path: cljrs-bin/
          retention-days: 1

  # Recipes legs: 8 shards x 3 runtimes (jvm, rs-from, rs-to).
  # Full-suite workstation time was ~65min JVM / ~30min RS at
  # --jobs 3, so ~10min/shard; the 60min cap is generous headroom.
  measure-recipes:
    needs: [resolve, build-rs]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # suite checkout
      actions: write # jars cache + shard artifact
    strategy:
      # Let every shard finish so partial artifacts upload for diagnosis.
      fail-fast: false
      matrix:
        # 0-based K/8: snip measure --shard needs 0 <= K < N.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        runtime: [jvm, rs-from, rs-to]
    name: recipes ${{ matrix.runtime }} (shard ${{ matrix.shard }}/8)
    steps:
      - name: Check out snippet suite
        uses: actions/checkout@v5
        with:
          repository: hhh-pa/clojure-code-snippet
          ref: ${{ needs.resolve.outputs.snippets_sha }}
          path: snippets

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: snippets/scripts/ci/go/go.mod
          cache: false # stdlib-only module: nothing to cache but the build below

      - name: Build snip
        run: |
          cd snippets/scripts/ci/go
          go build -o snip ./cmd/snip

      - name: Set up JDK 21
        if: matrix.runtime == 'jvm'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Clojure jars
        if: matrix.runtime == 'jvm'
        id: jars-cache
        uses: actions/cache@v5
        with:
          path: snippets/.ci/jars
          key: ${{ env.JARS_CACHE_KEY }}

      - name: Download Clojure jars
        if: matrix.runtime == 'jvm' && steps.jars-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p snippets/.ci/jars
          base=https://repo1.maven.org/maven2
          curl -fsSL -o snippets/.ci/jars/clojure.jar "$base/org/clojure/clojure/1.12.0/clojure-1.12.0.jar"
          curl -fsSL -o snippets/.ci/jars/spec.alpha.jar "$base/org/clojure/spec.alpha/0.5.238/spec.alpha-0.5.238.jar"
          curl -fsSL -o snippets/.ci/jars/core.specs.alpha.jar "$base/org/clojure/core.specs.alpha/0.4.74/core.specs.alpha-0.4.74.jar"

      - name: Decrypt and extract resources
        env:
          RESOURCES_PASSPHRASE: ${{ secrets.RESOURCES_PASSPHRASE }}
        working-directory: snippets
        run: |
          if [ -z "$RESOURCES_PASSPHRASE" ]; then
            echo "error: the RESOURCES_PASSPHRASE secret (organization level, with access to hhh-pa/clojure) is not configured." >&2
            exit 1
          fi
          mkdir -p tests/resources
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RESOURCES_PASSPHRASE" \
            -d tests/resources.tar.xz.asc | tar -xJ -C tests/resources --strip-components=1

      - name: Install GNU time
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y time

      - name: Use built clojure-rs
        if: matrix.runtime != 'jvm'
        uses: actions/download-artifact@v6
        with:
          name: cljrs-${{ matrix.runtime }}
          path: cljrs-bin

      - name: Add clojure-rs to PATH
        if: matrix.runtime != 'jvm'
        run: |
          # download-artifact does not preserve the executable bit.
          chmod +x "$GITHUB_WORKSPACE/cljrs-bin/clojure-rs"
          echo "$GITHUB_WORKSPACE/cljrs-bin" >> "$GITHUB_PATH"

      - name: Measure head-to-head shard
        working-directory: snippets
        run: |
          flags=(--runtime "${{ matrix.runtime }}")
          if [ "${{ matrix.runtime }}" != "jvm" ]; then
            flags+=(--command-template 'clojure-rs run {script}')
          fi
          ./scripts/ci/go/snip measure --resources tests/resources \
            --repeat 3 --no-alloc --no-perf --jobs 3 --timeout 300 \
            "${flags[@]}" \
            --shard ${{ matrix.shard }}/8 \
            --output "h2h-recipes-${{ matrix.runtime }}-shard-${{ matrix.shard }}.json" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: h2h-recipes-${{ matrix.runtime }}-shard-${{ matrix.shard }}
          path: snippets/h2h-recipes-${{ matrix.runtime }}-shard-${{ matrix.shard }}.json
          retention-days: 7

  # Algos legs: 8 shards x 3 runtimes (jvm, rs-from, rs-to). The
  # per-case timeout is 1800s (vs 300s for recipes), hence the
  # roomier job cap. No decrypt step: this suite carries its
  # resources/ in-repo.
  measure-algos:
    needs: [resolve, build-rs]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read # suite checkout
      actions: write # jars cache + shard artifact
    strategy:
      # Let every shard finish so partial artifacts upload for diagnosis.
      fail-fast: false
      matrix:
        # 0-based K/8: algoperf measure --shard needs 0 <= K < N.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        runtime: [jvm, rs-from, rs-to]
    name: algos ${{ matrix.runtime }} (shard ${{ matrix.shard }}/8)
    steps:
      - name: Check out algorithms suite
        uses: actions/checkout@v5
        with:
          repository: hhh-pa/clojure-algorithms
          ref: ${{ needs.resolve.outputs.algorithms_sha }}
          path: algos

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: algos/scripts/ci/go/go.mod
          cache: false # stdlib-only module: nothing to cache but the build below

      - name: Build algoperf
        run: |
          cd algos/scripts/ci/go
          go build -o algoperf ./cmd/algoperf

      - name: Set up JDK 21
        if: matrix.runtime == 'jvm'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Clojure jars
        if: matrix.runtime == 'jvm'
        id: jars-cache
        uses: actions/cache@v5
        with:
          path: algos/.ci/jars
          key: ${{ env.JARS_CACHE_KEY }}

      - name: Download Clojure jars
        if: matrix.runtime == 'jvm' && steps.jars-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p algos/.ci/jars
          base=https://repo1.maven.org/maven2
          curl -fsSL -o algos/.ci/jars/clojure.jar "$base/org/clojure/clojure/1.12.0/clojure-1.12.0.jar"
          curl -fsSL -o algos/.ci/jars/spec.alpha.jar "$base/org/clojure/spec.alpha/0.5.238/spec.alpha-0.5.238.jar"
          curl -fsSL -o algos/.ci/jars/core.specs.alpha.jar "$base/org/clojure/core.specs.alpha/0.4.74/core.specs.alpha-0.4.74.jar"

      - name: Install GNU time
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y time

      - name: Use built clojure-rs
        if: matrix.runtime != 'jvm'
        uses: actions/download-artifact@v6
        with:
          name: cljrs-${{ matrix.runtime }}
          path: cljrs-bin

      - name: Add clojure-rs to PATH
        if: matrix.runtime != 'jvm'
        run: |
          # download-artifact does not preserve the executable bit.
          chmod +x "$GITHUB_WORKSPACE/cljrs-bin/clojure-rs"
          echo "$GITHUB_WORKSPACE/cljrs-bin" >> "$GITHUB_PATH"

      - name: Measure head-to-head shard
        working-directory: algos
        run: |
          flags=(--runtime "${{ matrix.runtime }}")
          if [ "${{ matrix.runtime }}" = "jvm" ]; then
            jars=".ci/jars/clojure.jar:.ci/jars/spec.alpha.jar:.ci/jars/core.specs.alpha.jar"
            flags+=(--cp "$jars:src:test:resources")
          else
            flags+=(--command-template 'clojure-rs run perf/driver.clj {ns} src test resources')
          fi
          ./scripts/ci/go/algoperf measure \
            --repeat 3 --no-alloc --no-perf --jobs 3 --timeout 1800 \
            "${flags[@]}" \
            --shard ${{ matrix.shard }}/8 \
            --output "h2h-algos-${{ matrix.runtime }}-shard-${{ matrix.shard }}.json" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: h2h-algos-${{ matrix.runtime }}-shard-${{ matrix.shard }}
          path: algos/h2h-algos-${{ matrix.runtime }}-shard-${{ matrix.shard }}.json
          retention-days: 7

  # Fan-in: union the 8 shards per leg and diff the legs. Strict
  # across-the-board gate, both directions: JVM vs rs-to AND
  # rs-from vs rs-to — any CPU/RSS loss (or failure, missing,
  # not-ok, drift, leg mismatch) fails the PR. No Bencher reporting
  # by design: this job gates, it does not track history.
  h2h-compare:
    name: h2h cpu/mem gate
    needs: [measure-recipes, measure-algos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # compare script checkout
      actions: write # shard download + merged upload
    steps:
      - uses: actions/checkout@v5

      - name: Download shard results
        uses: actions/download-artifact@v6
        with:
          pattern: h2h-*-shard-*

      - name: Compare legs (strict gate, both directions)
        run: |
          # All four comparisons always run (all verdict tables land
          # in the summary) and any of them can fail the job, unless
          # triage mode greens everything.
          report_only=""
          if [ "${{ inputs.report_only }}" = "true" ]; then report_only="--report-only"; fi
          rc=0
          python3 scripts/ci/h2h_compare.py \
            --label recipes \
            --jvm h2h-recipes-jvm-shard-*/h2h-recipes-jvm-shard-*.json \
            --rs h2h-recipes-rs-from-shard-*/h2h-recipes-rs-from-shard-*.json \
            --merged-jvm h2h-recipes-jvm-merged.json \
            --merged-rs h2h-recipes-rs-from-merged.json \
            --summary-file "$GITHUB_STEP_SUMMARY" $report_only || rc=$?
          python3 scripts/ci/h2h_compare.py \
            --label algos \
            --jvm h2h-algos-jvm-shard-*/h2h-algos-jvm-shard-*.json \
            --rs h2h-algos-rs-from-shard-*/h2h-algos-rs-from-shard-*.json \
            --merged-jvm h2h-algos-jvm-merged.json \
            --merged-rs h2h-algos-rs-from-merged.json \
            --summary-file "$GITHUB_STEP_SUMMARY" $report_only || rc=$?
          python3 scripts/ci/h2h_compare.py \
            --label recipes-rsrs \
            --base-name rs-to --challenger-name rs-from \
            --jvm h2h-recipes-rs-to-shard-*/h2h-recipes-rs-to-shard-*.json \
            --rs h2h-recipes-rs-from-shard-*/h2h-recipes-rs-from-shard-*.json \
            --merged-jvm h2h-recipes-rs-to-merged.json \
            --merged-rs h2h-recipes-rs-from-merged.json \
            --summary-file "$GITHUB_STEP_SUMMARY" $report_only || rc=$?
          python3 scripts/ci/h2h_compare.py \
            --label algos-rsrs \
            --base-name rs-to --challenger-name rs-from \
            --jvm h2h-algos-rs-to-shard-*/h2h-algos-rs-to-shard-*.json \
            --rs h2h-algos-rs-from-shard-*/h2h-algos-rs-from-shard-*.json \
            --merged-jvm h2h-algos-rs-to-merged.json \
            --merged-rs h2h-algos-rs-from-merged.json \
            --summary-file "$GITHUB_STEP_SUMMARY" $report_only || rc=$?
          exit $rc

      - name: Upload merged leg JSONs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: h2h-merged
          path: h2h-*-merged.json
          retention-days: 14
