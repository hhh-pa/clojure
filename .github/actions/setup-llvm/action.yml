name: setup-llvm
description: >
  Install the pinned LLVM 22 toolchain for this runner via its OS
  package manager (apt.llvm.org on Linux, Homebrew llvm@22 on macOS,
  Chocolatey llvm on Windows), export LLVM_SYS_221_PREFIX plus PATH
  for the inkwell (clj-aot) build, and assert the LLVM 22.1 major so
  local, CI, and gate-image toolchains cannot drift (spec 2.3).
inputs:
  version:
    description: Pinned LLVM major (apt.llvm.org + brew llvm@N form).
    required: false
    default: "22"
  patch:
    description: Pinned Windows Chocolatey version (exact).
    required: false
    default: "22.1.8"
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y wget gnupg lsb-release
        wget -q https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh "${{ inputs.version }}"
        # llvm-22-dev brings llvm-config, CMake files, headers, and
        # static archives; the lib*-dev companions satisfy whatever
        # llvm-config --libs/--system-libs reports for static linking
        # (notably libPolly, which ships separately).
        sudo apt-get install -y "llvm-${{ inputs.version }}-dev" \
          "libpolly-${{ inputs.version }}-dev" \
          libffi-dev libzstd-dev zlib1g-dev libxml2-dev libtinfo-dev libedit-dev
        dir="/usr/lib/llvm-${{ inputs.version }}"
        test -x "$dir/bin/llvm-config"
        "$dir/bin/llvm-config" --version | grep -q '^22\.1\.'
        echo "$dir/bin" >> "$GITHUB_PATH"
        echo "LLVM_SYS_221_PREFIX=$dir" >> "$GITHUB_ENV"
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        HOMEBREW_NO_AUTO_UPDATE=1 brew install "llvm@${{ inputs.version }}"
        dir="$(brew --prefix "llvm@${{ inputs.version }}")"
        "$dir/bin/llvm-config" --version | grep -q '^22\.1\.'
        echo "$dir/bin" >> "$GITHUB_PATH"
        echo "LLVM_SYS_221_PREFIX=$dir" >> "$GITHUB_ENV"
    - if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        choco install llvm --version="${{ inputs.patch }}" -y --no-progress
        # Discover the install: choco wraps the official exe installer
        # (default C:\Program Files\LLVM), but probe defensively.
        dir=""
        for cand in "C:/Program Files/LLVM" "C:/Program Files (x86)/LLVM"; do
          if [ -x "$cand/bin/llvm-config.exe" ]; then dir="$cand"; break; fi
        done
        if [ -z "$dir" ]; then
          located="$(where llvm-config.exe 2>/dev/null | head -1 || true)"
          if [ -n "$located" ]; then dir="$(dirname "$(dirname "$located")")"; fi
        fi
        if [ -z "$dir" ] || [ ! -x "$dir/bin/llvm-config.exe" ]; then
          echo "setup-llvm: llvm-config.exe not found"
          echo "--- where:"; where llvm-config.exe || true
          echo "--- Program Files:"; ls "C:/Program Files" | grep -i llvm || true
          echo "--- choco lib:"; ls "C:/ProgramData/chocolatey/lib" | grep -i llvm || true
          exit 1
        fi
        echo "setup-llvm: LLVM at $dir"
        "$dir/bin/llvm-config.exe" --version | grep -q '^22\.1\.'
        echo "$dir/bin" >> "$GITHUB_PATH"
        echo "LLVM_SYS_221_PREFIX=$dir" >> "$GITHUB_ENV"
