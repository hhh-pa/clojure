# cargo-deny policy for the clojure-rs workspace, seeded from the
# arcanist rust workspace. Advisories are covered by cargo-audit
# instead (same RustSec DB), so there is intentionally no
# [advisories] section; CI runs `cargo deny check licenses bans sources`.
[licenses]
allow = [
    # Our own license (workspace members are checked too).
    "EPL-1.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
[licenses.private]
ignore = true
[bans]
multiple-versions = "deny"
# wildcards = allow: duplicate versions (the costly half of bans)
# are still denied above.
wildcards = "allow"
skip = []
[sources]
unknown-registry = "deny"
unknown-git = "deny"
