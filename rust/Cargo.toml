[workspace]
members = [
    "crates/clj-aot",
    "crates/clj-core",
    "crates/clj-eval",
    "crates/clj-reader",
    "crates/clj-repl",
    "crates/clj-rt",
    "crates/clj-value",
]
resolver = "2"

[package]
name = "clojure-rs"
version = "1.13.0-alpha11"
edition = "2024"
# MSRV floor for the direct workspace libs; the default `aot`
# feature pulls clj-aot (inkwell, unproven MSRV), so a default
# 1.85 build is not covered — the msrv CI leg excludes it
# (s9-plan D2) and every clj-aot-free crate carries this key.
rust-version = "1.85"
description = "Native Clojure runtime, REPL, and LLVM AOT compiler"
license = "EPL-1.0"
autobins = false

[[bin]]
name = "clojure-rs"
path = "src/bin/clojure-rs/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clj-aot = { path = "crates/clj-aot", optional = true }
clj-eval = { path = "crates/clj-eval" }
clj-repl = { path = "crates/clj-repl" }
clj-value = { path = "crates/clj-value" }

# The global allocator off Linux (see `main.rs`).
[target.'cfg(not(target_os = "linux"))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[features]
default = ["aot"]
aot = ["clj-aot"]

# Test-only fd juggling (piped-stdin validator coverage): Unix-gated
# so Windows builds never compile it.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["pipe", "stdio"] }

# Release builds ship the interpreter (#226): one codegen unit and
# fat LTO let the hot value/eval paths inline across the crate seams.
[profile.release]
lto = "fat"
codegen-units = 1

# Deny the `unused` lint group workspace-wide, on every platform and
# profile: clippy's `-D warnings` only runs on Linux CI, so without
# this, Windows/macOS-only dead code compiles with warnings no gate
# catches. Mirrors the arcanist rust workspace policy.
[workspace.lints.rust]
unused = "deny"

[lints]
workspace = true
