[package]
name = "clj-aot"
version = "1.13.0-alpha11"
edition = "2024"
# No rust-version key: inkwell 0.11.0 declares no MSRV, so the 1.85
# floor is unproven for this crate (S9A D2: the MSRV leg excludes
# LLVM-dependent compilation).
description = "LLVM AOT backend for the pure Clojure subset"
license = "EPL-1.0"

[lints]
workspace = true

[dependencies]
clj-bc = { path = "../clj-bc" }
clj-eval = { path = "../clj-eval" }
clj-reader = { path = "../clj-reader" }
clj-rt = { path = "../clj-rt" }
clj-value = { path = "../clj-value" }
# Pinned LLVM major for the whole workspace (spec 2.3): inkwell 0.11.0
# with `llvm23-1`, matching rustc's LLVM 23 (#260: the shared major
# lets generated code link the runtime-helper bitcode with LTO).
# The feature only compiles against LLVM 23 (llvm-sys build script
# rejects anything else), which is the real version enforcement;
# CI additionally asserts `llvm-config --version`.
# Host targets only (default `target-all` references every target's
# init symbols, which the Windows MSVC import set does not satisfy;
# x86+aarch64 covers all supported runners and release hosts).
inkwell = { version = "0.11.0", default-features = false, features = [
    "llvm23-1",
    "target-aarch64",
    "target-x86",
] }
