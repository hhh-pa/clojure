[package]
name = "clj-rt"
version = "0.1.0"
edition = "2024"
description = "AOT runtime archive for compiled Clojure binaries (opaque-box FFI helpers)"
license = "EPL-1.0"

[lib]
name = "cljrt"
crate-type = ["staticlib", "rlib"]

[dependencies]
clj-eval = { path = "../clj-eval" }
clj-value = { path = "../clj-value" }

[lints]
workspace = true
