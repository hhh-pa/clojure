[package]
name = "clj-repl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Interactive REPL loop for clojure-rs"
license = "EPL-1.0"

[lints]
workspace = true

[dependencies]
clj-eval = { path = "../clj-eval" }
clj-reader = { path = "../clj-reader" }
clj-value = { path = "../clj-value" }
# Minimal features (S9A MSRV): `with-dirs` pulls `home 0.5.12`
# (rustc 1.88+), which we never touch — file history only.
rustyline = { version = "19.0.0", default-features = false, features = ["with-file-history"] }
