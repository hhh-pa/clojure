\* TLC config for executor (#188 single-thread executor cell).
\* Tight finite bounds: 2 submitters x 3 jobs, one racing
\* shutdown, one draining worker. No unbounded CHOOSE anywhere;
\* the state space is finite by construction.

SPECIFICATION FairSpec

CONSTANTS
    Submitters = {s1, s2}
    J = 3

INVARIANTS
    TypeOK
    Safety

PROPERTIES
    Liveness
