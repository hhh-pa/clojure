\* TLC config for agent_queue (S9D agent send/send-off discipline).
\* Tight finite bounds: 2 senders x 2 direct sends (+1 nested each),
\* 2 racing restarters, both error modes and every pool assignment
\* (mode/poolOf are chosen in Init, fixed per behavior).
\* No unbounded CHOOSE anywhere; the state space is finite by
\* construction (every script counter only decreases, every other
\* variable ranges over a finite set).

SPECIFICATION FairSpec

CONSTANTS
    Senders = {s1, s2}
    Restarters = {r1, r2}
    K = 2
    NESTED = 1

INVARIANTS
    TypeOK
    Safety

PROPERTIES
    Liveness
