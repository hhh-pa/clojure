\* TLC config for channel_mailbox (#188 channel mailbox core).
\* Tight finite bounds: 3 putters x 2 puts, 3 takers x 2 takes,
\* buffer CAP=1, queue bound MAX=2 (MAX-QUEUE-SIZE scaled; 3
\* threads per side so the qfull arms stay reachable under the
\* blocking scripts). The buffer kind (unbuf/fixed/dropping/sliding)
\* and the sliding `integral` flag are chosen in Init, fixed per
\* behavior. No unbounded CHOOSE anywhere; the state space is finite
\* by construction (every script counter only increases to its
\* bound, every other variable ranges over a finite set).
\* No liveness: channel ops block by design, so Terminating is an
\* unconditional stutter and the deadlock check is vacuous --
\* Safety carries every pin (see the spec header).

SPECIFICATION Spec

CONSTANTS
    Putters = {p1, p2, p3}
    Takers = {t1, t2, t3}
    K = 2
    M = 2
    CAP = 1
    MAX = 2

INVARIANTS
    TypeOK
    Safety
