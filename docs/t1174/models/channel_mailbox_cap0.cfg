\* TLC config for channel_mailbox at CAP=0 (#188 buffer-empty edges):
\* fixed-0 queues every put (rendezvous only via the puts queue),
\* dropping-0 drops every put, sliding-0-integral errors EmptyEvict
\* (EvictErrorOnlySlidingZero). Same scripts and queue bound as
\* channel_mailbox.cfg; same vacuous-deadlock note.

SPECIFICATION Spec

CONSTANTS
    Putters = {p1, p2, p3}
    Takers = {t1, t2, t3}
    K = 2
    M = 2
    CAP = 0
    MAX = 2

INVARIANTS
    TypeOK
    Safety
